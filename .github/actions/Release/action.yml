name: Release

inputs:
  tag_version:
    required: true
    type: string
  token:
    description: 'A Github PAT'
    required: true

runs:
  using: "composite"
  steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Create Real Tag
      uses: anothrNick/github-tag-action@v1
      env:
        GITHUB_TOKEN: ${{ inputs.token }}
        CUSTOM_TAG: ${{ inputs.tag_version }}

    - name: Extract Release Notes
      id: release_notes
      shell: bash
      run: |
        VERSION="${{ inputs.tag_version }}"
        VERSION="${VERSION#v}"

        TEMP='^## \[[0-9]\.[0-9]'
        VTEMP="^## \[${VERSION}"
        CMD="/$VTEMP/ && "'!'"f {f=1; next} /$TEMP/ && f {exit} f"

        awk "$CMD" CHANGELOG.md > /tmp/release_notes.txt

        if [ ! -s /tmp/release_notes.txt ]; then
          echo "Release notes not found in CHANGELOG.md for version $VERSION"
          echo "Last version found in CHANGELOG.md: $(
          awk "/$TEMP/ {print \$2; exit}" CHANGELOG.md)"
          exit 1
        fi

    - name: Download All Artifacts
      uses: actions/download-artifact@v4
      with:
        path: ./artifacts
        merge-multiple: true

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ inputs.tag_version }}
        files: artifacts/**/*
        body_path: /tmp/release_notes.txt
        generate_release_notes: true
        make_latest: true
      env:
        GITHUB_TOKEN: ${{ inputs.token }}
